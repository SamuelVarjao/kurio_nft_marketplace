<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurio · Marketplace de NFTs</title>
    <meta name="description" content="Kurio: descubra, colecione e compre NFTs selecionados de criadores emergentes e consagrados, com arte digital verificada." />
    <meta name="theme-color" content="#130c0a" />
    <meta property="og:title" content="Kurio · Marketplace de NFTs" />
    <meta property="og:description" content="Seja dono do futuro da arte digital." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // A imagem do hero (LCP da home) só é descoberta após o JS; pré-carrega só na home.
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.fetchPriority = 'high'
        l.href = '/images/nfts/emerald-640.webp'
        l.imageSrcset = '/images/nfts/emerald-320.webp 320w, /images/nfts/emerald-640.webp 640w, /images/nfts/emerald-960.webp 960w'
        l.imageSizes = '(min-width: 768px) 450px, 46vw'
        document.head.appendChild(l)
      }
    </script>
    <style>
      html,body{background:#130c0a;color:#f4f0eb;margin:0}
      #boot{font:700 14px/1 'Roboto Mono',ui-monospace,monospace;letter-spacing:.2em;padding:26px max(16px,calc((100vw - 1200px)/2));border-bottom:1px solid #3f2318}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" aria-hidden="true">KURIO</div></div>
    <noscript>A Kurio precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
